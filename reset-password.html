<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Reset Password - Ayah by Ayah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #111118;
      --surface: #1a1a24;
      --surface2: #222230;
      --accent: #c9a84c;
      --accent-dim: rgba(201,168,76,0.15);
      --text: #e8e4dc;
      --text-dim: rgba(232,228,220,0.45);
      --text-mid: rgba(232,228,220,0.7);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .reset-card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--surface2);
      border-radius: 20px;
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .reset-logo {
      font-family: 'Amiri', serif;
      font-size: 1.8rem;
      color: var(--accent);
    }

    .reset-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }

    .reset-sub {
      font-size: 0.8rem;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.5;
    }

    .reset-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-top: 4px;
    }

    .reset-form input {
      background: var(--bg);
      border: 1px solid var(--surface2);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      font-family: 'Inter', sans-serif;
    }

    .reset-form input:focus { border-color: var(--accent); }
    .reset-form input::placeholder { color: var(--text-dim); }

    .password-rules {
      font-size: 0.72rem;
      line-height: 1.6;
      color: var(--text-dim);
      padding: 4px 2px;
    }

    .pw-rule { display: flex; align-items: center; gap: 6px; }
    .pw-rule .check { color: #e74c3c; font-size: 0.8rem; }
    .pw-rule.pass .check { color: #2ecc71; }
    .pw-rule.pass { color: var(--text-mid); }

    .reset-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 13px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: transform 0.15s;
      margin-top: 4px;
    }

    .reset-btn:hover { transform: scale(1.02); }
    .reset-btn:disabled { opacity: 0.5; transform: none; cursor: default; }

    .back-link {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 8px;
      font-family: 'Inter', sans-serif;
      text-decoration: underline;
    }

    .back-link:hover { color: var(--text-mid); }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      width: 90%;
      max-width: 380px;
    }

    .toast {
      pointer-events: auto;
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      animation: toastIn 0.3s ease, toastOut 0.3s ease 3.2s forwards;
    }

    .toast-icon { font-size: 1.1rem; flex-shrink: 0; }

    .toast.success { background: #1a2e1a; border: 1px solid rgba(46,204,113,0.3); color: #2ecc71; }
    .toast.error { background: #2e1a1a; border: 1px solid rgba(231,76,60,0.3); color: #e74c3c; }
    .toast.info { background: #1a1a2e; border: 1px solid rgba(100,150,255,0.3); color: #6496ff; }

    @keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-12px); } }
  </style>
</head>
<body>

  <div class="reset-card">
    <div class="reset-logo">Ayah by Ayah</div>
    <div class="reset-title">Reset Your Password</div>
    <p class="reset-sub">Choose a strong new password for your account.</p>

    <form class="reset-form" id="resetForm" autocomplete="on">
      <input type="password" id="newPassword" placeholder="New password" required minlength="8" autocomplete="new-password" name="new-password" />
      <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="8" autocomplete="new-password" name="confirm-password" />
      <div class="password-rules" id="passwordRules">
        <div class="pw-rule" id="ruleLen"><span class="check">&#10005;</span> At least 8 characters</div>
        <div class="pw-rule" id="ruleUpper"><span class="check">&#10005;</span> One uppercase letter</div>
        <div class="pw-rule" id="ruleLower"><span class="check">&#10005;</span> One lowercase letter</div>
        <div class="pw-rule" id="ruleNum"><span class="check">&#10005;</span> One number</div>
        <div class="pw-rule" id="ruleSpecial"><span class="check">&#10005;</span> One special character (!@#$...)</div>
        <div class="pw-rule" id="ruleMatch"><span class="check">&#10005;</span> Passwords match</div>
      </div>
      <button type="submit" class="reset-btn" id="resetBtn">Update Password</button>
    </form>

    <button class="back-link" onclick="window.location.href='index.html'">Back to sign in</button>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const SUPABASE_URL = 'https://zmkqhjitnijxafroznmz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_KMvO-DqZIXOaGzxiJ5NRog_QokljpPK';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function sanitizeText(raw) {
      return raw.replace(/[<>&"']/g, c => ({ '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;', "'":'&#39;' })[c])
                .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast ' + type;
      const icons = { success: '\u2713', error: '\u2717', info: '\u24D8' };
      toast.innerHTML = '<span class="toast-icon">' + (icons[type] || '') + '</span><span>' + sanitizeText(message) + '</span>';
      container.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3500);
    }

    function validatePassword(pw) {
      return {
        len: pw.length >= 8,
        upper: /[A-Z]/.test(pw),
        lower: /[a-z]/.test(pw),
        num: /[0-9]/.test(pw),
        special: /[^A-Za-z0-9]/.test(pw)
      };
    }

    function updateRules() {
      const pw = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const v = validatePassword(pw);
      const match = pw.length > 0 && pw === confirm;

      const rules = { ruleLen: v.len, ruleUpper: v.upper, ruleLower: v.lower, ruleNum: v.num, ruleSpecial: v.special, ruleMatch: match };
      for (const [id, pass] of Object.entries(rules)) {
        const el = document.getElementById(id);
        el.classList.toggle('pass', pass);
        el.querySelector('.check').innerHTML = pass ? '&#10003;' : '&#10005;';
      }
      return Object.values(v).every(Boolean) && match;
    }

    document.getElementById('newPassword').addEventListener('input', updateRules);
    document.getElementById('confirmPassword').addEventListener('input', updateRules);

    // Check we actually have a recovery session
    sb.auth.getSession().then(({ data: { session } }) => {
      if (!session) {
        showToast('No active reset session. Please request a new reset link.', 'error');
        document.getElementById('resetBtn').disabled = true;
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const pw = document.getElementById('newPassword').value;
      const btn = document.getElementById('resetBtn');

      if (pw.length > 128) {
        showToast('Password must be 128 characters or fewer.', 'error');
        return;
      }

      if (!updateRules()) {
        showToast('Please fix the password requirements above.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      const { error } = await sb.auth.updateUser({ password: pw });

      if (error) {
        showToast(error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Update Password';
      } else {
        showToast('Password updated successfully!', 'success');
        btn.textContent = 'Redirecting...';
        setTimeout(() => { window.location.href = 'index.html'; }, 2000);
      }
    });
  </script>
</body>
</html>
